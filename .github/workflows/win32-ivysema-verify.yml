# Verification-only workflow (lives on the fork's verify/ branch, not part of
# the upstream PR): compiles the modified win32_ivysema.c with real MSVC on a
# GitHub-hosted windows-2022 runner and links libpq.dll. Build recipe (msys
# bison/flex, pip meson, vcvarsall, meson flags) mirrors the repository's own
# pg-ci.yml windows-vs job; only the build target is reduced (libpq instead
# of "all testprep"), no tests are run.
name: win32 ivysema compile verify

on:
  push:
    branches: [ verify/libpq-ivysema-win32 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  win32-compile:
    name: MSVC compile of win32_ivysema.c + libpq link
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: cmd
    env:
      TAR: "c:/windows/system32/tar.exe"
      MESON_COMMON_PG_CONFIG_ARGS: -Dcassert=true -Dinjection_points=true
      # Same feature set as pg-ci.yml windows-vs
      MESON_FEATURES: >-
        -Dauto_features=disabled
        -Dcpp_args=/std:c++20
        -Dldap=enabled
        -Dplperl=enabled
        -Dplpython=enabled
        -Dssl=openssl
        -Dtap_tests=enabled
    steps:
      - uses: actions/checkout@v4

      # Drop Mercurial's directory from PATH so the hostedtoolcache
      # python3.dll wins the DLL search (as in pg-ci.yml).
      - name: Remove Mercurial from PATH
        shell: pwsh
        run: |
          $filtered = ($env:PATH -split ';' |
            Where-Object { $_ -and ($_ -notmatch '\\Mercurial\\?$') }) -join ';'
          Add-Content $env:GITHUB_ENV "PATH=$filtered"
          Write-Host "Removed Mercurial entries from PATH"

      - name: Install bison/flex via msys64
        shell: 'C:\msys64\usr\bin\bash.exe --login -eo pipefail "{0}"'
        run: |
          pacman -S --noconfirm --needed --asdeps bison flex
          echo C:/msys64/usr/bin >> "$GITHUB_PATH"
          echo C:/Strawberry/perl/bin >> "$GITHUB_PATH"

      - name: Install meson/ninja
        shell: pwsh
        run: |
          python -m pip install --upgrade meson ninja
          meson --version
          ninja --version

      - name: Configure (pg-ci windows-vs flags)
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          meson setup --backend ninja %MESON_COMMON_PG_CONFIG_ARGS% %MESON_FEATURES% --buildtype debug -Db_pch=true -DTAR=%TAR% build

      - name: Show the win32_ivysema object in the build graph
        run: |
          ninja -C build -t targets all | findstr /i ivysema

      - name: Build libpq (compiles win32_ivysema.c with MSVC and links)
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          ninja -C build src/interfaces/libpq/libpq.dll
          dir build\src\interfaces\libpq\libpq.dll

      - name: Source-level assertions
        shell: bash
        run: |
          set -eux
          # the compiled sources are the PR's: no exit( left, three abort()
          ! grep -n 'exit *(' src/interfaces/libpq/win32_ivysema.c
          test "$(grep -c 'abort()' src/interfaces/libpq/win32_ivysema.c)" = "3"
          ! grep -n 'exit *(' src/interfaces/libpq/sysv_ivysema.c
          git log -1 --format='%H %s'
